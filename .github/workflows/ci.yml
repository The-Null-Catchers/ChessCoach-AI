name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chesscoach
          POSTGRES_USER: chesscoach
          POSTGRES_PASSWORD: chesscoach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chesscoach -d chesscoach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://chesscoach:chesscoach@localhost:5432/chesscoach
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend/app backend/tests
      - working-directory: backend
        run: alembic upgrade head
      - run: pytest backend/tests
      - working-directory: backend
        run: alembic current

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: mobile
        run: flutter create . --platforms=android --org ai.chesscoach
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze
      - working-directory: mobile
        run: flutter test
      - working-directory: mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v6
        with:
          name: chesscoach-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t chesscoach-backend ./backend
      - run: docker build -t chesscoach-web ./web

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Audit Python dependencies
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r backend/requirements.txt

      - name: Audit web dependencies
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - working-directory: web
        run: npm audit --audit-level=high

      - name: Scan repository for vulnerabilities, secrets and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
