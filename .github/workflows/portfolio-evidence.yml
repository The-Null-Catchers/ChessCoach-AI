name: Portfolio Evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-evidence.yml'
      - 'web/e2e/**'
      - 'web/playwright.config.ts'
      - 'PORTFOLIO_*.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/portfolio-evidence.yml'
      - 'web/e2e/**'
      - 'web/playwright.config.ts'
      - 'PORTFOLIO_*.md'

permissions:
  contents: read

concurrency:
  group: portfolio-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    # Keep the pinned Playwright browser compatible with the runner OS.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chesscoach
          POSTGRES_USER: chesscoach
          POSTGRES_PASSWORD: chesscoach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chesscoach -d chesscoach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://chesscoach:chesscoach@localhost:5432/chesscoach
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      E2E_WEB_URL: http://127.0.0.1:3000
      PORTFOLIO_EVIDENCE: "true"
      PORTFOLIO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ADMIN_EMAILS: admin-e2e@example.com
      AI_PROVIDER: template
    steps:
      - uses: actions/checkout@v7

      - name: Create ephemeral demo credentials
        shell: bash
        run: |
          set -euo pipefail
          email="portfolio-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT@example.com"
          password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$jwt_secret"
          echo "PORTFOLIO_DEMO_EMAIL=$email" >> "$GITHUB_ENV"
          echo "PORTFOLIO_DEMO_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install real analysis engine and media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish ffmpeg
          ffprobe -version

      - name: Install backend dependencies and seed deterministic demo
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.txt
          cd backend
          alembic upgrade head
          PYTHONPATH=. ALLOW_PORTFOLIO_DEMO_SEED=true python scripts/seed_portfolio_demo.py
          PYTHONPATH=. ALLOW_PORTFOLIO_DEMO_ADMIN=true python scripts/enable_portfolio_demo_admin.py

      - name: Record engine identity
        run: |
          python - <<'PY'
          import os
          import chess.engine
          with chess.engine.SimpleEngine.popen_uci('/usr/games/stockfish') as engine:
              name = engine.id['name']
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PORTFOLIO_ENGINE_NAME={name}\\n')
          PY

      - name: Start API
        run: |
          set -euo pipefail
          nohup python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000 >/tmp/chesscoach-portfolio-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chesscoach-portfolio-api.log
          exit 1

      - name: Start real analysis worker
        run: |
          cd backend
          nohup celery -A app.tasks.celery_app.celery worker -Q analysis --loglevel=INFO --concurrency=1 >/tmp/chesscoach-portfolio-worker.log 2>&1 &
          sleep 3
          pgrep -f "celery.*app.tasks.celery_app.celery" >/dev/null || { cat /tmp/chesscoach-portfolio-worker.log; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install web and browser dependencies
        working-directory: web
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start web client
        working-directory: web
        run: |
          set -euo pipefail
          nohup npm run dev -- --hostname 0.0.0.0 >/tmp/chesscoach-portfolio-web.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chesscoach-portfolio-web.log
          exit 1

      - name: Capture portfolio evidence
        working-directory: web
        run: npx playwright test e2e/portfolio-evidence.spec.ts e2e/auth-admin.spec.ts --project=chromium --workers=1

      - name: Print service logs on failure
        if: failure()
        run: |
          cat /tmp/chesscoach-portfolio-api.log || true
          cat /tmp/chesscoach-portfolio-web.log || true
          cat /tmp/chesscoach-portfolio-worker.log || true

      - name: Inventory raw browser recording durations
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          videos = sorted(pathlib.Path("web/test-results").rglob("video.webm"))
          rows = []
          for video in videos:
              result = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "default=noprint_wrappers=1:nokey=1", str(video)],
                  capture_output=True, text=True, check=False,
              )
              duration = float(result.stdout.strip()) if result.returncode == 0 and result.stdout.strip() else None
              rows.append({"path": str(video), "duration_seconds": duration,
                           "in_presentation_range": duration is not None and 60 <= duration <= 120})
          output = pathlib.Path("web/portfolio-evidence/video-duration-inventory.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({"raw_recordings": rows,
              "note": "Raw browser recordings are not an edited presentation video."}, indent=2) + "\\n")
          print(output.read_text())
          PY

      - name: Upload portfolio evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chesscoach-portfolio-evidence-${{ github.run_id }}
          path: |
            web/portfolio-evidence
            web/playwright-report
            web/test-results/**/video.webm
          if-no-files-found: error
          retention-days: 30
