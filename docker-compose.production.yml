services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - chesscoach_pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru
    volumes:
      - chesscoach_redisdata:/data
    mem_limit: 256m
    cpus: 0.20
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    cpus: 0.50

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery worker -Q analysis,notifications --loglevel=INFO --concurrency=1
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 3g
    cpus: 1.00

  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery beat --loglevel=INFO
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.15

  web:
    build:
      context: ./web
      args:
        INTERNAL_API_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "3100:3000"
    depends_on:
      - backend
    mem_limit: 768m
    cpus: 0.40

volumes:
  chesscoach_pgdata:
  chesscoach_redisdata:
