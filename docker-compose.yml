services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chesscoach
      POSTGRES_USER: chesscoach
      POSTGRES_PASSWORD: chesscoach
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://chesscoach:chesscoach@db:5432/chesscoach
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-dev-secret-change-me
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery worker -Q analysis --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://chesscoach:chesscoach@db:5432/chesscoach
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-dev-secret-change-me
    depends_on: [db, redis]
  web:
    build: ./web
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
